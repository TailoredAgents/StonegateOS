name: Agent integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://stonegate_test:stonegate_test@127.0.0.1:5432/stonegate_agent_test
      ADMIN_API_KEY: stonegate-agent-local-test-only
      TEAM_KILL_EXTERNAL_SENDS: "true"
      SMS_CAMPAIGN_SENDS_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stonegate_test
          POSTGRES_PASSWORD: stonegate_test
          POSTGRES_DB: stonegate_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stonegate_test -d stonegate_agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:release-latest
      - name: Check boundaries and existing authorization
        run: node apps/api/scripts/run-jest-partitions.cjs --runInBand --testPathPattern='agent-integration|team-mutation.test|team-permission'
      - name: Exercise real MCP client, writes, approval and revocation
        run: |
          set -euo pipefail
          pnpm --filter api dev > /tmp/stonegate-agent-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --max-time 10 --output /dev/null http://localhost:3001/api/mcp; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          pnpm --filter api exec tsx scripts/test-agent-integration.mts
      - name: Retain synthetic server diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-integration-server
          path: /tmp/stonegate-agent-api.log
          retention-days: 5
