name: Cloudflare migration validation
on:
  push:
    branches: [codex/cloudflare-migration]
    paths:
      - infra/cloudflare/**
      - scripts/migration/**
      - .github/workflows/cloudflare-migration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-migration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-manifest:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      build: ${{ steps.manifest.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: manifest
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(readFileSync('infra/cloudflare/source-manifest.json','utf8'));
          const matrix=Object.entries(m.services).map(([service,revision])=>({service,revision,node:m.runtimeByService[service]}));
          if(matrix.length!==4 || matrix.some(x=>!['site','api','outbox','discord'].includes(x.service) || !/^[a-f0-9]{40}$/.test(x.revision) || !/^24\.\d+\.\d+$/.test(x.node)))throw Error('Invalid pinned source manifest');
          appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify(matrix)+'\n');
          const buildPaths=new Set(['infra/cloudflare/Dockerfile','infra/cloudflare/build-site.mjs','infra/cloudflare/native-probe.mjs','infra/cloudflare/source-manifest.json','apps/api/src/__tests__/database-ssl.test.ts']);
          const before=process.env.BEFORE_SHA;
          const changed=process.env.GITHUB_EVENT_NAME==='push' && before && !/^0+$/.test(before)?execFileSync('git',['diff','--name-only',before,process.env.GITHUB_SHA],{encoding:'utf8'}).trim().split('\n'):[];
          const build=process.env.GITHUB_EVENT_NAME==='workflow_dispatch' || !before || /^0+$/.test(before) || changed.some(p=>buildPaths.has(p)||p.startsWith('infra/cloudflare/patches/'));
          appendFileSync(process.env.GITHUB_OUTPUT,'build='+build+'\n');
          JS
  recovery-tool-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --prefix scripts/migration
      - run: node --test scripts/migration/*.test.mjs
  container-build:
    needs: source-manifest
    if: needs.source-manifest.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.source-manifest.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: migration
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          path: source
          persist-credentials: false
      - name: Add migration runtime files to the pinned source
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p source/infra/cloudflare
          cp migration/infra/cloudflare/Dockerfile migration/infra/cloudflare/native-probe.mjs migration/infra/cloudflare/build-site.mjs source/infra/cloudflare/
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {resolve} from 'node:path';
          const {compatibilityPatches}=JSON.parse(readFileSync('migration/infra/cloudflare/source-manifest.json','utf8'));
          const selected=compatibilityPatches.filter(p=>!p.services||p.services.includes(process.env.SERVICE));
          for(const patch of selected) {
            if(createHash('sha256').update(readFileSync('migration/'+patch.path)).digest('hex')!==patch.sha256)throw Error('Compatibility patch hash mismatch');
            const filename=resolve('migration/'+patch.path);
            execFileSync('git',['apply','--check',filename],{cwd:'source'});
            execFileSync('git',['apply',filename],{cwd:'source'});
          }
          writeFileSync('source/infra/cloudflare/compatibility-patches.json',JSON.stringify(selected));
          JS
          cp migration/apps/api/src/__tests__/database-ssl.test.ts source/apps/api/src/__tests__/database-ssl.test.ts
          mkdir -p source/scripts/migration
          cp migration/scripts/migration/worker-drain.test.mjs source/scripts/migration/
          cp migration/scripts/migration/discord-drain.test.mjs migration/scripts/migration/discord-drain-integration.mjs source/scripts/migration/
          cat > source/.dockerignore <<'EOF'
          .git
          **/node_modules
          **/.env*
          **/.dev.vars*
          output
          artifacts
          EOF
      - name: Build pinned application image
        env:
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ matrix.revision }}
          NODE_VERSION: ${{ matrix.node }}
          SITE_BUILD_ENV: ${{ secrets.STONEGATE_MIGRATION_SITE_PUBLIC_ENV }}
        run: docker build --secret id=site_build_env,env=SITE_BUILD_ENV --build-arg SERVICE="$SERVICE" --build-arg SOURCE_REVISION="$REVISION" --build-arg NODE_VERSION="$NODE_VERSION" -f source/infra/cloudflare/Dockerfile -t stonegate-migration:"$SERVICE" source
      - name: Test native libraries without external network access
        env:
          SERVICE: ${{ matrix.service }}
        run: docker run --rm --network none stonegate-migration:"$SERVICE" node infra/cloudflare/native-probe.mjs --self-test
      - name: Publish immutable candidate image
        env:
          SERVICE: ${{ matrix.service }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/tailoredagents/stonegate-migration-${SERVICE}:${GITHUB_SHA}"
          docker tag stonegate-migration:"$SERVICE" "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
