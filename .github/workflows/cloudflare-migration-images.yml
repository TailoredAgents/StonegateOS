name: Transfer verified migration images
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of a successful migration image build
        type: string
        required: true
permissions:
  contents: read
  packages: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [site, api, outbox, discord]
    steps:
      - name: Transfer already-tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ secrets.CF_MIGRATION_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.CF_MIGRATION_REGISTRY_PASSWORD }}
          SERVICE: ${{ matrix.service }}
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          build_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-migration.yml/runs?head_sha=$CANDIDATE&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          test -n "$build_run"
          successful=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run/jobs?per_page=100" --jq '[.jobs[] | select((.name | startswith("container-build")) and .conclusion == "success")] | length')
          test "$successful" -eq 4
          test -n "$REGISTRY_USER" && test -n "$REGISTRY_PASSWORD"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_PASSWORD" | docker login registry.cloudflare.com -u "$REGISTRY_USER" --password-stdin
          source="ghcr.io/tailoredagents/stonegate-migration-${SERVICE}:${CANDIDATE}"
          destination="registry.cloudflare.com/78ed83c6e3947c93763acef3a48a5561/stonegate-migration-${SERVICE}:${CANDIDATE}"
          docker pull "$source"
          docker tag "$source" "$destination"
          docker push "$destination"
          docker image inspect "$destination" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
