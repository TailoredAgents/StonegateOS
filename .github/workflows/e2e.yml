name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  expense-v2-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://myst:myst@localhost:5432/mystos

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mystos
          POSTGRES_USER: myst
          POSTGRES_PASSWORD: myst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myst -d mystos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations through the production prefix
        run: >-
          pnpm --filter api exec tsx scripts/migrate-to-target.ts
          0101_online_booking_quote_range_backfill

      - name: Seed populated Expense V2 migration regression
        run: >-
          pnpm --filter api exec tsx
          scripts/expense-v2-migration-regression.ts seed

      - name: Apply remaining database migrations
        run: pnpm db:migrate

      - name: Verify populated Expense V2 migration regression
        run: >-
          pnpm --filter api exec tsx
          scripts/expense-v2-migration-regression.ts verify

      - name: Run mandatory expense workflow integration tests
        run: >-
          pnpm --filter api test -- --runInBand
          src/__tests__/expense-v2-database-guards.integration.test.ts
          src/__tests__/expense-submission-workflow.integration.test.ts
          src/__tests__/expense-receipt-confirmation.integration.test.ts
          src/__tests__/expense-receipt-analysis-retry.integration.test.ts
          src/__tests__/expense-receipt-duplicate-concurrency.integration.test.ts
          src/__tests__/expense-managed-lifecycle.integration.test.ts
          src/__tests__/expense-operations-monitor.integration.test.ts
          src/__tests__/expense-reimbursement-payout-transitions.integration.test.ts
          src/__tests__/expense-fixed-costs.integration.test.ts

  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Prepare environment
        run: |
          pnpm e2e:env
          mkdir -p artifacts/e2e/logs

      - name: Typecheck changed applications
        run: pnpm typecheck

      - name: Enforce lint debt ratchet
        run: pnpm lint:ratchet

      - name: Run API unit tests
        run: pnpm test

      - name: Run mobile expense contract tests
        working-directory: apps/site
        run: >-
          node --import tsx --test
          test/binary-upload.test.ts
          test/legacy-expense-receipt.test.ts
          test/mobile-expense-capture-route.test.ts
          test/mobile-expense-capture-single-flight.test.ts
          test/receipt-upload-admission.test.ts
          test/mobile-fixed-cost-route.test.ts
          test/mobile-spend-v2.test.ts

      - name: Validate mobile service worker syntax
        run: node --check apps/site/public/mobile-sw.js

      - name: Build applications
        run: pnpm build

      - name: Start dev stack and run Playwright suite
        env:
          CI: "true"
        run: |
          pnpm dev:e2e &
          echo $! > dev-server.pid
          services_ready=false
          for attempt in {1..90}; do
            if curl -fsS http://localhost:3000/api/healthz >/dev/null && curl -fsS http://localhost:3001/api/healthz >/dev/null; then
              services_ready=true
              break
            fi
            sleep 2
          done
          if [ "$services_ready" != "true" ]; then
            echo "Services failed to pass health checks" >&2
            for log_file in artifacts/e2e/logs/*.log; do
              if [ -f "$log_file" ]; then
                echo "::group::$log_file"
                tail -n 200 "$log_file"
                echo "::endgroup::"
              fi
            done
            exit 1
          fi
          pnpm test:e2e

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/e2e

      - name: Cleanup e2e data
        if: always()
        run: pnpm cleanup:e2e || true

      - name: Kill dev stack
        if: always()
        run: |
          if [ -f dev-server.pid ]; then
            kill $(cat dev-server.pid) || true
          fi
          docker compose -f devops/docker-compose.yml logs --no-color > artifacts/e2e/logs/docker.log || true
          docker compose -f devops/docker-compose.yml down || true
